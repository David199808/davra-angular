<!--CONTENIDO DESTACADO-->
<main>
  <section class="bienvenida">
    <h1 class="bienvenida__titulo">¡Bienvenidos a DAVRAWEAR!</h1>
    <p class="bienvenida__descripcion">
      Ropa urbana streetwear para hombre y mujer. <strong>Explora nuestras colecciones.</strong>
    </p>
  </section>

  <!-- IMAGENES DESTACADO -->
  <section class="destacado">
    <a class="destacado__link" routerLink="/hombre">
      <span class="destacado__titulo">Colección Hombre</span>
      <img
        class="destacado__imagen"
        src="imagenes/hombre/camisa-negra-estampado.webp"
        alt="camisa negra estampado"
        loading="lazy"
      />
    </a>

    <a class="destacado__link" routerLink="/mujer">
      <span class="destacado__titulo">Colección Mujer</span>
      <img
        class="destacado__imagen"
        src="imagenes/mujer/blusa-cuello-tortuga-negra.webp"
        alt="blusa cuello tortuga negra"
        loading="lazy"
      />
    </a>
  </section>
</main>
